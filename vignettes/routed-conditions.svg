<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 197" width="1070" height="197" role="img" aria-label="logtree console output with warning() and message() routed into the tree">
<title>R conditions routed into the logtree tree</title>
<rect x="0.5" y="0.5" width="1069" height="196" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<g stroke-linecap="round">
<line x1="23.93" y1="35.00" x2="23.93" y2="101.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="23.93" y1="44.50" x2="35.70" y2="44.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="23.93" y1="63.50" x2="35.70" y2="63.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="23.93" y1="82.50" x2="35.70" y2="82.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="23.93" y1="101.50" x2="35.70" y2="101.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="13">
<text x="20.00" y="29" xml:space="preserve"><tspan fill="#1b7c83">▶</tspan><tspan fill="#24292f"> Parse batch</tspan></text>
<text x="43.55" y="48" xml:space="preserve"><tspan fill="#0969da">ℹ</tspan><tspan fill="#24292f"> using cached schema</tspan></text>
<text x="43.55" y="67" xml:space="preserve"><tspan fill="#9a6700">⚠</tspan><tspan fill="#24292f"> 3 rows coerced to NA</tspan></text>
<text x="43.55" y="86" xml:space="preserve"><tspan fill="#1a7f37">✔</tspan><tspan fill="#24292f"> 1,200 rows parsed</tspan></text>
<text x="43.55" y="105" xml:space="preserve"><tspan fill="#9a6700">⚠</tspan><tspan fill="#24292f"> Done  0.80s</tspan></text>
<text x="20.00" y="124" xml:space="preserve"><tspan fill="#1a7f37">✔</tspan><tspan fill="#24292f"> Run complete in 6.50s</tspan></text>
<text x="20.00" y="162" xml:space="preserve"><tspan fill="#24292f">── Summary: 1 warning ──────────────────────────────────────────────────────────</tspan></text>
<text x="20.00" y="181" xml:space="preserve"><tspan fill="#9a6700">⚠</tspan><tspan fill="#24292f"> </tspan><tspan fill="#24292f">Parse batch</tspan><tspan fill="#8b949e"> › </tspan><tspan fill="#24292f">3 rows coerced to NA</tspan></text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="11">
<line x1="216.40" y1="44.50" x2="698.00" y2="44.50" stroke="#d0d7de" stroke-width="1" stroke-dasharray="1 3"/>
<circle cx="702.00" cy="44.50" r="2" fill="#0969da"/>
<text x="708.00" y="48.17" fill="#0969da">message() becomes an info leaf, at the depth it happened</text>
<line x1="224.25" y1="63.50" x2="698.00" y2="63.50" stroke="#d0d7de" stroke-width="1" stroke-dasharray="1 3"/>
<circle cx="702.00" cy="63.50" r="2" fill="#9a6700"/>
<text x="708.00" y="67.17" fill="#9a6700">warning() becomes a warn leaf — muffled, not re-raised</text>
<line x1="153.60" y1="101.50" x2="698.00" y2="101.50" stroke="#d0d7de" stroke-width="1" stroke-dasharray="1 3"/>
<circle cx="702.00" cy="101.50" r="2" fill="#9a6700"/>
<text x="708.00" y="105.17" fill="#9a6700">and it elevates its step, exactly as log_warn() does</text>
<line x1="656.00" y1="158.50" x2="698.00" y2="158.50" stroke="#d0d7de" stroke-width="1" stroke-dasharray="1 3"/>
<circle cx="702.00" cy="158.50" r="2" fill="#8b949e"/>
<text x="708.00" y="162.17" fill="#8b949e">so it reaches the digest like any other warning</text>
</g>
</svg>

