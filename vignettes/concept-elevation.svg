<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 662 159" width="662" height="159" role="img" aria-label="A logtree tree where a warning leaf elevates its enclosing step's close glyph">
<title>Status elevation</title>
<rect x="0.5" y="0.5" width="661" height="158" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<g stroke-linecap="round">
<line x1="47.47" y1="54.00" x2="47.47" y2="120.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="23.93" y1="35.00" x2="23.93" y2="139.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="23.93" y1="44.50" x2="35.70" y2="44.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="47.47" y1="63.50" x2="59.25" y2="63.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="47.47" y1="82.50" x2="59.25" y2="82.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="47.47" y1="101.50" x2="59.25" y2="101.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="47.47" y1="120.50" x2="59.25" y2="120.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="23.93" y1="139.50" x2="35.70" y2="139.50" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="13">
<text x="20.00" y="29" xml:space="preserve"><tspan fill="#1b7c83">▶</tspan><tspan fill="#24292f"> Load data</tspan></text>
<text x="43.55" y="48" xml:space="preserve"><tspan fill="#1b7c83">▶</tspan><tspan fill="#24292f"> Parse rows</tspan></text>
<text x="67.10" y="67" xml:space="preserve"><tspan fill="#0969da">ℹ</tspan><tspan fill="#24292f"> 1,200 rows</tspan></text>
<text x="67.10" y="86" xml:space="preserve"><tspan fill="#9a6700">⚠</tspan><tspan fill="#24292f"> coerced 3 rows to NA</tspan></text>
<text x="67.10" y="105" xml:space="preserve"><tspan fill="#1a7f37">✔</tspan><tspan fill="#24292f"> parsed</tspan></text>
<text x="67.10" y="124" xml:space="preserve"><tspan fill="#9a6700">⚠</tspan><tspan fill="#24292f"> Done  0.80s</tspan></text>
<text x="43.55" y="143" xml:space="preserve"><tspan fill="#1a7f37">✔</tspan><tspan fill="#24292f"> Done  6.50s</tspan></text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="11">
<line x1="169.30" y1="63.50" x2="290.00" y2="63.50" stroke="#d0d7de" stroke-width="1" stroke-dasharray="1 3"/>
<circle cx="294.00" cy="63.50" r="2" fill="#0969da"/>
<text x="300.00" y="67.17" fill="#0969da">an info leaf leaves its step alone</text>
<line x1="247.80" y1="82.50" x2="290.00" y2="82.50" stroke="#d0d7de" stroke-width="1" stroke-dasharray="1 3"/>
<circle cx="294.00" cy="82.50" r="2" fill="#9a6700"/>
<text x="300.00" y="86.17" fill="#9a6700">log_warn() elevates the nearest open step</text>
<line x1="137.90" y1="101.50" x2="290.00" y2="101.50" stroke="#d0d7de" stroke-width="1" stroke-dasharray="1 3"/>
<circle cx="294.00" cy="101.50" r="2" fill="#1a7f37"/>
<text x="300.00" y="105.17" fill="#1a7f37">a later success cannot undo it — elevation only moves up</text>
<line x1="177.15" y1="120.50" x2="290.00" y2="120.50" stroke="#d0d7de" stroke-width="1" stroke-dasharray="1 3"/>
<circle cx="294.00" cy="120.50" r="2" fill="#9a6700"/>
<text x="300.00" y="124.17" fill="#9a6700">so the step closes warned, having never thrown</text>
</g>
</svg>

